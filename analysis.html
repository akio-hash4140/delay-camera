<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マット運動 AI動作分析</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0',
                            700: '#334155', 800: '#1e293b', 900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- MediaPipe Pose JS -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; }
        .material-symbols-outlined { vertical-align: middle; }
        .loader {
            border: 3px solid #e2e8f0; border-top: 3px solid #3b82f6;
            border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .picking-mode canvas { cursor: crosshair !important; z-index: 30 !important; pointer-events: auto !important; }
        .picking-mode video, .picking-mode img { filter: brightness(0.5); }
        .picking-overlay { display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(220, 38, 38, 0.9); color: white; padding: 8px 16px; border-radius: 99px; font-weight: bold; font-size: 0.9rem; z-index: 40; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); white-space: nowrap; }
        .picking-mode .picking-overlay { display: flex; align-items: center; gap: 6px; }
        
        /* 巨大なアクションボタン用のクラス */
        .big-action-btn { display: none; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1rem; padding: 12px 32px; border-radius: 99px; color: white; box-shadow: 0 6px 16px rgba(0,0,0,0.5); border: 2px solid white; transition: transform 0.1s; pointer-events: auto; cursor: pointer; }
        .big-action-btn:active { transform: scale(0.95); }
        
        /* 巨大再生ボタン */
        .huge-play-overlay { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; background: rgba(0,0,0,0.1); z-index: 25; cursor: pointer; }
        .huge-play-icon { font-size: 80px; color: white; opacity: 0.9; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); transition: transform 0.2s; }
        .huge-play-overlay:hover .huge-play-icon { transform: scale(1.1); opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-12 shrink-0 bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shadow-sm z-20">
        <div class="flex items-center space-x-2">
            <span class="material-symbols-outlined text-blue-600">directions_run</span>
            <h1 class="font-bold text-base text-slate-800">マット運動 AI分析</h1>
        </div>
        <div id="aiStatus" class="flex items-center gap-1.5 text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">
            <div class="loader"></div>
            <span id="aiStatusText">AI準備中...</span>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 grid-rows-2 md:grid-rows-1 gap-3 p-3 min-h-0">

        <!-- PANEL 1: 模範動画/画像 -->
        <section class="bg-white rounded-lg p-2 md:p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm relative">
            <div class="flex items-center gap-2 mb-2 shrink-0">
                <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap flex items-center gap-1">
                    <span class="material-symbols-outlined" style="font-size: 14px;">menu_book</span> 見本
                </span>
                <select id="taskSelect" onchange="changeModelMedia()" class="flex-1 bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500">
                    <option value="">データを読み込み中...</option>
                </select>
            </div>

            <div id="modelContainer" class="flex-1 bg-black rounded overflow-hidden relative group">
                <video id="modelVideo" controls playsinline class="absolute inset-0 w-full h-full object-contain hidden"></video>
                <img id="modelImage" class="absolute inset-0 w-full h-full object-contain hidden">
                <canvas id="modelCanvas" class="absolute inset-0 w-full h-full object-contain pointer-events-none z-10 hidden"></canvas>
                
                <div id="modelPlaceholder" class="absolute inset-0 flex items-center justify-center bg-slate-900 text-slate-400 text-sm font-bold pointer-events-none z-20">
                    上のメニューから技を選んでください
                </div>

                <!-- 巨大な再生ボタン（見本側） -->
                <div id="modelPlayOverlay" class="huge-play-overlay" onclick="document.getElementById('modelVideo').play()">
                    <span class="material-symbols-outlined huge-play-icon">play_circle</span>
                </div>
            </div>
        </section>

        <!-- PANEL 2: 自分の動画とモーションキャプチャ -->
        <section class="bg-white rounded-lg p-2 md:p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm relative">
            <div class="flex items-center justify-between gap-2 mb-2 shrink-0">
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap flex items-center gap-1">
                        <span class="material-symbols-outlined" style="font-size: 14px;">person_play</span> 自分の動き
                    </span>
                    <label id="uploadLabel" class="cursor-not-allowed bg-slate-300 text-slate-500 text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors">
                        <span class="material-symbols-outlined" style="font-size: 16px;">upload_file</span> 動画を選ぶ
                        <input type="file" id="videoUpload" accept="video/*" class="hidden" disabled>
                    </label>
                </div>
            </div>

            <div id="studentContainer" class="flex-1 bg-black rounded overflow-hidden relative group">
                <video id="studentVideo" controls playsinline class="absolute inset-0 w-full h-full object-contain hidden"></video>
                <canvas id="studentCanvas" class="absolute inset-0 w-full h-full object-contain pointer-events-none z-10 hidden"></canvas>
                
                <div id="studentPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm font-bold pointer-events-none z-20">
                    <span class="material-symbols-outlined text-4xl mb-1 text-slate-300">cloud_upload</span>
                    AIの準備完了後に動画を選んでください
                </div>

                <!-- ピッキング中のお知らせ -->
                <div class="picking-overlay"><span class="material-symbols-outlined">ads_click</span> 画面の関節をタップ (<span class="pick-count">0</span>/3)</div>

                <!-- 巨大な再生ボタン（自分側） -->
                <div id="studentPlayOverlay" class="huge-play-overlay" onclick="document.getElementById('studentVideo').play()">
                    <span class="material-symbols-outlined huge-play-icon">play_circle</span>
                </div>

                <!-- 巨大なアクションボタン (一時停止中のみ表示) -->
                <div class="absolute bottom-8 left-0 right-0 flex flex-col items-center gap-3 z-30 pointer-events-none">
                    <div id="startPickBtn" class="big-action-btn bg-blue-600 hover:bg-blue-700" onclick="startPickingMode()">
                        <span class="material-symbols-outlined" style="font-size: 28px;">edit</span> 角度を測る
                    </div>
                    <div id="resetPickBtn" class="big-action-btn bg-red-600 hover:bg-red-700" onclick="resetPoints()">
                        <span class="material-symbols-outlined" style="font-size: 28px;">delete</span> ポイントをリセット
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        let modelVideo, modelImage, studentVideo, videoUpload;
        let taskDataList = [];

        let poseModelModel, poseModelStudent; 
        let isAiReady = false;
        let lastPoseModel = null, lastPoseStudent = null;
        let isProcessingModel = false, isProcessingStudent = false;

        let selectedJoints = [];
        let currentPickingTarget = null; 

        window.addEventListener('DOMContentLoaded', () => {
            modelVideo = document.getElementById('modelVideo');
            modelImage = document.getElementById('modelImage');
            studentVideo = document.getElementById('studentVideo');
            videoUpload = document.getElementById('videoUpload');

            // ★GAS側との通信（元々完璧に動いていたオリジナルの記述に完全に戻しました）
            if (window.opener) {
                window.opener.postMessage({ type: 'APP_READY' }, '*');
            } else {
                document.getElementById("taskSelect").innerHTML = '<option value="">メインアプリから開いてください</option>';
            }

            initAI();
            setupEventListeners();
        });

        // 動画や画像のBase64を受け取る処理
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'TASK_DATA') {
                const data = event.data.payload;
                populateSelect(data);
            }
            if (event.data && event.data.type === 'BASE64_RESULT') {
                const base64Data = event.data.base64;
                const mediaType = event.data.mediaType;
                const placeholder = document.getElementById("modelPlaceholder");
                const canvas = document.getElementById("modelCanvas");
                
                if (base64Data) {
                    placeholder.classList.add('hidden');
                    canvas.classList.remove('hidden');
                    
                    if (mediaType === 'image') {
                        modelImage.src = base64Data;
                        modelImage.classList.remove('hidden');
                        updateActionButtonsUI();
                        
                        modelImage.onload = async () => {
                            canvas.width = modelImage.naturalWidth;
                            canvas.height = modelImage.naturalHeight;
                            if (isAiReady) {
                                try { await poseModelModel.send({ image: modelImage }); } 
                                catch (e) { console.error("AI解析エラー:", e); }
                            }
                        };
                    } else {
                        modelVideo.src = base64Data;
                        modelVideo.classList.remove('hidden');
                        
                        modelVideo.onloadedmetadata = () => {
                            canvas.width = modelVideo.videoWidth;
                            canvas.height = modelVideo.videoHeight;
                            updateActionButtonsUI();
                            modelVideo.play();
                        };
                    }
                } else {
                    placeholder.innerHTML = "読み込みに失敗しました";
                }
            }
        });

        function populateSelect(data) {
            taskDataList = data;
            const select = document.getElementById("taskSelect");
            select.innerHTML = '<option value="">▼ 技を選択してください</option>';
            data.forEach((task, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = task.name;
                select.appendChild(option);
            });
        }

        // 見本メニュー変更時
        function changeModelMedia() {
            const select = document.getElementById("taskSelect");
            const placeholder = document.getElementById("modelPlaceholder");
            const canvas = document.getElementById("modelCanvas");
            const ctx = canvas.getContext('2d');
            
            modelVideo.pause();
            modelVideo.removeAttribute('src');
            modelVideo.load();
            modelImage.removeAttribute('src');
            
            modelVideo.classList.add('hidden');
            modelImage.classList.add('hidden');
            canvas.classList.add('hidden');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lastPoseModel = null;
            updateActionButtonsUI();
            
            if (select.value === "") {
                placeholder.classList.remove('hidden');
                placeholder.innerHTML = "上のメニューから技を選んでください";
                return;
            }
            
            const task = taskDataList[select.value];
            if (!task.url) {
                placeholder.classList.remove('hidden');
                placeholder.innerHTML = "この技の見本メディアは未登録です";
                return;
            }
            
            placeholder.classList.remove('hidden');
            placeholder.innerHTML = '<div class="loader"></div><span class="ml-2 text-white">データを準備中...</span>';
            
            // ★GAS側へBase64要求（これも元々動いていたオリジナルの記述に完全に戻しました）
            if (window.opener) {
                window.opener.postMessage({ type: 'REQUEST_BASE64', fileId: task.fileId, mediaType: task.type }, '*');
            }
        }

        // UI（巨大な再生ボタンや、ポイントを打つボタン）の表示切替
        function updateActionButtonsUI() {
            const startBtn = document.getElementById('startPickBtn');
            const resetBtn = document.getElementById('resetPickBtn');
            const studentPlay = document.getElementById('studentPlayOverlay');
            const modelPlay = document.getElementById('modelPlayOverlay');

            // 自分の動画のUI制御
            if (!studentVideo.src || !studentVideo.paused || currentPickingTarget === 'student') {
                // 再生中、ピッキング中、未選択時は隠す
                startBtn.style.display = 'none';
                resetBtn.style.display = 'none';
                studentPlay.style.display = 'none';
            } else {
                // 一時停止中
                studentPlay.style.display = 'flex';
                if (selectedJoints.length > 0) {
                    startBtn.style.display = 'none';
                    resetBtn.style.display = 'flex';
                } else {
                    startBtn.style.display = 'flex';
                    resetBtn.style.display = 'none';
                }
            }

            // 見本動画のUI制御 (画像ではなく、動画が一時停止している場合のみ巨大再生ボタンを表示)
            if (modelVideo.src && modelVideo.paused && modelImage.classList.contains('hidden')) {
                modelPlay.style.display = 'flex';
            } else {
                modelPlay.style.display = 'none';
            }
        }

        async function initAI() {
            try {
                const config = {
                    modelComplexity: 1, 
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                };

                document.getElementById('aiStatusText').innerText = 'AI準備中 (1/2)...';
                
                poseModelModel = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                poseModelModel.setOptions(config);
                poseModelModel.onResults((results) => {
                    lastPoseModel = results.poseLandmarks || null;
                    const isImage = !modelImage.classList.contains('hidden');
                    drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, isImage ? true : modelVideo.paused);
                });
                await poseModelModel.initialize();

                document.getElementById('aiStatusText').innerText = 'AI準備中 (2/2)...';
                
                poseModelStudent = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                poseModelStudent.setOptions(config);
                poseModelStudent.onResults((results) => {
                    lastPoseStudent = results.poseLandmarks || null;
                    drawSkeleton(document.getElementById('studentCanvas'), lastPoseStudent, studentVideo.paused);
                });
                await poseModelStudent.initialize();

                isAiReady = true;
                
                const aiStatus = document.getElementById('aiStatus');
                aiStatus.innerHTML = '<span class="material-symbols-outlined text-emerald-500" style="font-size:16px;">check_circle</span> AI準備完了';
                aiStatus.classList.replace('bg-slate-100', 'bg-emerald-50');
                aiStatus.classList.replace('text-slate-500', 'text-emerald-700');
                
                const uploadLabel = document.getElementById('uploadLabel');
                uploadLabel.classList.remove('cursor-not-allowed', 'bg-slate-300', 'text-slate-500');
                uploadLabel.classList.add('cursor-pointer', 'bg-emerald-600', 'hover:bg-emerald-700', 'text-white');
                videoUpload.disabled = false;
                
                document.getElementById('studentPlaceholder').innerHTML = '<span class="material-symbols-outlined text-4xl mb-1 text-slate-300">cloud_upload</span>自分の動画を選択してください';

            } catch (error) {
                console.error("AI Error:", error);
                document.getElementById('aiStatus').innerHTML = `<span class="material-symbols-outlined text-red-500" style="font-size:16px;">error</span> エラー`;
            }
        }

        function setupEventListeners() {
            // ★重要修正: 「動画画面全体をクリックして再生停止」する処理を削除し、誤作動（競合）を完全になくしました。
            // 動画の再生/一時停止は、動画下部の「標準コントロールバー」か「中央の巨大な再生ボタン」でのみ行います。

            // 見本動画のイベント
            modelVideo.addEventListener('play', () => { 
                updateActionButtonsUI();
                requestAnimationFrame(processModelLoop); 
            });
            modelVideo.addEventListener('pause', () => { 
                updateActionButtonsUI();
                drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, true); 
            });
            modelVideo.addEventListener('seeked', async () => { 
                if (isAiReady && modelVideo.readyState >= 2) await poseModelModel.send({ image: modelVideo }); 
            });

            // 自分の動画のイベント（★見本動画との同期再生）
            studentVideo.addEventListener('play', () => { 
                updateActionButtonsUI();
                requestAnimationFrame(processStudentLoop); 
                
                // 見本動画も連動して再生させる
                if (!modelVideo.classList.contains('hidden') && modelVideo.paused) {
                    modelVideo.play();
                }
            });
            studentVideo.addEventListener('pause', () => { 
                updateActionButtonsUI();
                drawSkeleton(document.getElementById('studentCanvas'), lastPoseStudent, true); 
                
                // 見本動画も連動して一時停止させる
                if (!modelVideo.classList.contains('hidden') && !modelVideo.paused) {
                    modelVideo.pause();
                }
            });
            studentVideo.addEventListener('seeked', async () => { 
                if (isAiReady && studentVideo.readyState >= 2) await poseModelStudent.send({ image: studentVideo }); 
            });

            // 動画アップロード時
            videoUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file || !isAiReady) return;
                
                studentVideo.src = URL.createObjectURL(file);
                document.getElementById('studentPlaceholder').classList.add('hidden');
                studentVideo.classList.remove('hidden');
                document.getElementById('studentCanvas').classList.remove('hidden');
                
                studentVideo.onloadedmetadata = () => {
                    document.getElementById('studentCanvas').width = studentVideo.videoWidth;
                    document.getElementById('studentCanvas').height = studentVideo.videoHeight;
                    updateActionButtonsUI();
                };
            });

            // キャンバスのクリック（ピッキング用）は自分側のみ許可
            document.getElementById('studentCanvas').addEventListener('click', (e) => {
                if (currentPickingTarget === 'student') handleCanvasClick(e, document.getElementById('studentCanvas'), lastPoseStudent);
            });
        }

        async function processModelLoop() {
            if (!modelVideo.paused && !modelVideo.ended && !isProcessingModel && modelVideo.readyState >= 2) {
                isProcessingModel = true;
                await poseModelModel.send({ image: modelVideo });
                isProcessingModel = false;
                requestAnimationFrame(processModelLoop);
            }
        }

        async function processStudentLoop() {
            if (!studentVideo.paused && !studentVideo.ended && !isProcessingStudent && studentVideo.readyState >= 2) {
                isProcessingStudent = true;
                await poseModelStudent.send({ image: studentVideo });
                isProcessingStudent = false;
                requestAnimationFrame(processStudentLoop);
            }
        }

        // ポイントを打つモードの開始
        function startPickingMode() {
            currentPickingTarget = 'student';
            selectedJoints = []; 
            
            document.getElementById('studentContainer').classList.add('picking-mode');
            
            updatePickCountUI();
            updateActionButtonsUI(); 
            
            const isImage = !modelImage.classList.contains('hidden');
            drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, isImage ? true : modelVideo.paused);
            drawSkeleton(document.getElementById('studentCanvas'), lastPoseStudent, studentVideo.paused);
        }

        // ポイントを打つモードの終了
        function endPickingMode() {
            if (!currentPickingTarget) return;
            document.getElementById('studentContainer').classList.remove('picking-mode');
            currentPickingTarget = null;

            updateActionButtonsUI(); 
            
            // ★見本と自分の両方のキャンバスに自動描画（ポイント連動）
            const isImage = !modelImage.classList.contains('hidden');
            drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, isImage ? true : modelVideo.paused);
            drawSkeleton(document.getElementById('studentCanvas'), lastPoseStudent, studentVideo.paused);
        }

        function updatePickCountUI() {
            document.querySelectorAll('.pick-count').forEach(el => { el.textContent = selectedJoints.length; });
        }

        // ポイントのリセット
        function resetPoints() {
            selectedJoints = [];
            currentPickingTarget = null;
            document.getElementById('studentContainer').classList.remove('picking-mode');
            
            updateActionButtonsUI(); 
            
            // 両方のキャンバスからポイントを消去
            const isImage = !modelImage.classList.contains('hidden');
            drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, isImage ? true : modelVideo.paused);
            drawSkeleton(document.getElementById('studentCanvas'), lastPoseStudent, studentVideo.paused);
        }

        // キャンバスをクリックして関節を選択する処理
        function handleCanvasClick(event, canvas, poseLandmarks) {
            if (!poseLandmarks || currentPickingTarget !== 'student') return;
            
            const rect = canvas.getBoundingClientRect();
            const videoRatio = canvas.width / canvas.height;
            const rectRatio = rect.width / rect.height;
            
            let drawWidth, drawHeight, offsetX, offsetY;
            if (videoRatio > rectRatio) {
                drawWidth = rect.width;
                drawHeight = rect.width / videoRatio;
                offsetX = 0;
                offsetY = (rect.height - drawHeight) / 2;
            } else {
                drawHeight = rect.height;
                drawWidth = rect.height * videoRatio;
                offsetX = (rect.width - drawWidth) / 2;
                offsetY = 0;
            }

            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            const normX = (clickX - offsetX) / drawWidth;
            const normY = (clickY - offsetY) / drawHeight;

            if (normX < 0 || normX > 1 || normY < 0 || normY > 1) return; 

            let minDist = 0.15; 
            let closestJoint = -1;
            const targetJoints = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];

            targetJoints.forEach(i => {
                const p = poseLandmarks[i];
                if (p && p.visibility > 0.5) {
                    const dist = Math.sqrt(Math.pow(p.x - normX, 2) + Math.pow(p.y - normY, 2));
                    if (dist < minDist) {
                        minDist = dist;
                        closestJoint = i;
                    }
                }
            });

            if (closestJoint !== -1) {
                const index = selectedJoints.indexOf(closestJoint);
                if (index !== -1) {
                    selectedJoints.splice(index, 1);
                } else {
                    if (selectedJoints.length < 3) {
                        selectedJoints.push(closestJoint);
                    }
                }
                
                updatePickCountUI();
                
                if (selectedJoints.length === 3) {
                    // 3点目を選んだら自動でモード終了し、見本側にも反映
                    endPickingMode();
                } else {
                    // ★1, 2点選択中もリアルタイムで見本側に反映させる
                    const isImage = !modelImage.classList.contains('hidden');
                    drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, isImage ? true : modelVideo.paused);
                    drawSkeleton(canvas, poseLandmarks, studentVideo.paused);
                }
            }
        }

        function calculateAngle(p1, p2, p3, width, height) {
            const p1x = p1.x * width;
            const p1y = p1.y * height;
            const p2x = p2.x * width;
            const p2y = p2.y * height;
            const p3x = p3.x * width;
            const p3y = p3.y * height;

            const radians = Math.atan2(p3y - p2y, p3x - p2x) - Math.atan2(p1y - p2y, p1x - p2x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360.0 - angle;
            return Math.round(angle);
        }

        function drawSkeleton(canvas, poseLandmarks, isPaused) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!poseLandmarks) return;

            const width = canvas.width;
            const height = canvas.height;

            if (currentPickingTarget || selectedJoints.length === 0) {
                if (currentPickingTarget) {
                    const guideJoints = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
                    ctx.lineWidth = 3;
                    guideJoints.forEach(i => {
                        const p = poseLandmarks[i];
                        if (p && p.visibility > 0.5) {
                            ctx.beginPath();
                            ctx.arc(p.x * width, p.y * height, 12, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.stroke();
                        }
                    });
                }
                
                if (selectedJoints.length > 0) {
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = '#00FF00';
                    ctx.beginPath();
                    let firstPoint = true;
                    selectedJoints.forEach(jointIndex => {
                        const p = poseLandmarks[jointIndex];
                        if (p && p.visibility > 0.2) {
                            if (firstPoint) { ctx.moveTo(p.x * width, p.y * height); firstPoint = false; } 
                            else { ctx.lineTo(p.x * width, p.y * height); }
                        }
                    });
                    if (!firstPoint) ctx.stroke();

                    selectedJoints.forEach((jointIndex, order) => {
                        const p = poseLandmarks[jointIndex];
                        if (p && p.visibility > 0.2) {
                            ctx.beginPath();
                            ctx.arc(p.x * width, p.y * height, 20, 0, 2 * Math.PI);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fill();
                            ctx.lineWidth = 6;
                            ctx.strokeStyle = '#FF0000';
                            ctx.stroke();
                            
                            ctx.fillStyle = '#000000';
                            ctx.font = 'bold 24px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(order + 1, p.x * width, p.y * height);
                        }
                    });
                }
                return;
            }

            ctx.lineWidth = 8;
            ctx.strokeStyle = '#00FF00';
            ctx.beginPath();
            let firstPoint = true;
            selectedJoints.forEach(jointIndex => {
                const p = poseLandmarks[jointIndex];
                if (p && p.visibility > 0.2) {
                    if (firstPoint) { ctx.moveTo(p.x * width, p.y * height); firstPoint = false; } 
                    else { ctx.lineTo(p.x * width, p.y * height); }
                }
            });
            if (!firstPoint) ctx.stroke();

            selectedJoints.forEach((jointIndex, order) => {
                const p = poseLandmarks[jointIndex];
                if (p && p.visibility > 0.2) {
                    ctx.beginPath();
                    ctx.arc(p.x * width, p.y * height, 24, 0, 2 * Math.PI);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = '#FF0000';
                    ctx.stroke();
                    
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 28px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(order + 1, p.x * width, p.y * height);
                }
            });

            if (selectedJoints.length === 3) {
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const pt1 = poseLandmarks[selectedJoints[0]];
                const pt2 = poseLandmarks[selectedJoints[1]];
                const pt3 = poseLandmarks[selectedJoints[2]];

                if (pt1 && pt2 && pt3 && pt1.visibility > 0.2 && pt2.visibility > 0.2 && pt3.visibility > 0.2) {
                    const angle = calculateAngle(pt1, pt2, pt3, width, height);
                    const x = pt2.x * width;
                    const y = pt2.y * height - 55; 

                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 8;
                    ctx.strokeText(angle + '°', x, y);
                    ctx.fillStyle = '#FFFF00';
                    ctx.fillText(angle + '°', x, y);
                }
            }
        }
    </script>
