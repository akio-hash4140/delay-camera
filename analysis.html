<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マット運動 AI動作分析</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0',
                            700: '#334155', 800: '#1e293b', 900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- MediaPipe Pose JS -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; }
        .material-symbols-outlined { vertical-align: middle; }
        .loader {
            border: 3px solid #e2e8f0; border-top: 3px solid #3b82f6;
            border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-12 shrink-0 bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shadow-sm z-20">
        <div class="flex items-center space-x-2">
            <span class="material-symbols-outlined text-blue-600">directions_run</span>
            <h1 class="font-bold text-base text-slate-800">マット運動 AI分析</h1>
        </div>
        <div id="aiStatus" class="flex items-center gap-1.5 text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">
            <div class="loader"></div>
            <span id="aiStatusText">AI準備中...</span>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 grid-rows-2 md:grid-rows-1 gap-3 p-3 min-h-0">

        <!-- PANEL 1: 模範動画/画像 -->
        <section class="bg-white rounded-lg p-2 md:p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm relative">
            <div class="flex items-center gap-2 mb-2 shrink-0">
                <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap flex items-center gap-1">
                    <span class="material-symbols-outlined" style="font-size: 14px;">menu_book</span> 見本
                </span>
                <select id="taskSelect" onchange="changeModelMedia()" class="flex-1 bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500">
                    <option value="">データを読み込み中...</option>
                </select>
            </div>

            <div class="flex-1 bg-black rounded overflow-hidden relative group">
                <!-- ★変更: videoとimgを両方用意し、初期はhidden -->
                <video id="modelVideo" controls crossorigin="anonymous" playsinline class="absolute inset-0 w-full h-full object-contain hidden"></video>
                <img id="modelImage" crossorigin="anonymous" class="absolute inset-0 w-full h-full object-contain hidden">
                
                <canvas id="modelCanvas" class="absolute inset-0 w-full h-full object-contain pointer-events-none z-10"></canvas>
                
                <div id="modelPlaceholder" class="absolute inset-0 flex items-center justify-center bg-slate-900 text-slate-400 text-sm font-bold pointer-events-none z-20">
                    上のメニューから技を選んでください
                </div>
            </div>
        </section>

        <!-- PANEL 2: 自分の動画とモーションキャプチャ -->
        <section class="bg-white rounded-lg p-2 md:p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm relative">
            <div class="flex items-center justify-between gap-2 mb-2 shrink-0">
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap flex items-center gap-1">
                        <span class="material-symbols-outlined" style="font-size: 14px;">person_play</span> 自分の動き
                    </span>
                    <label id="uploadLabel" class="cursor-not-allowed bg-slate-300 text-slate-500 text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors">
                        <span class="material-symbols-outlined" style="font-size: 16px;">upload_file</span> 動画を選ぶ
                        <input type="file" id="videoUpload" accept="video/*" class="hidden" disabled>
                    </label>
                </div>
                <div class="hidden sm:block text-xs text-slate-500 font-bold">
                    ※一時停止で「角度」が出ます
                </div>
            </div>

            <div class="flex-1 bg-black rounded overflow-hidden relative group">
                <video id="studentVideo" controls playsinline class="absolute inset-0 w-full h-full object-contain hidden"></video>
                <canvas id="studentCanvas" class="absolute inset-0 w-full h-full object-contain pointer-events-none z-10 hidden"></canvas>
                
                <div id="studentPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm font-bold pointer-events-none z-20">
                    <span class="material-symbols-outlined text-4xl mb-1 text-slate-300">cloud_upload</span>
                    AIの準備完了後に動画を選んでください
                </div>
            </div>
        </section>

    </main>

    <script>
        // DOM要素
        let modelVideo, modelImage, studentVideo, videoUpload;
        let taskDataList = [];

        // AI関連
        let poseModelModel, poseModelStudent; 
        let isAiReady = false;
        let lastPoseModel = null, lastPoseStudent = null;
        let isProcessingModel = false, isProcessingStudent = false;

        window.addEventListener('DOMContentLoaded', () => {
            modelVideo = document.getElementById('modelVideo');
            modelImage = document.getElementById('modelImage');
            studentVideo = document.getElementById('studentVideo');
            videoUpload = document.getElementById('videoUpload');

            // ★変更: 親タブ(GASメインアプリ)に「準備完了」の合図を送る
            if (window.opener) {
                window.opener.postMessage({ type: 'APP_READY' }, '*');
            } else {
                document.getElementById("taskSelect").innerHTML = '<option value="">メインアプリから開いてください</option>';
            }

            // 2. AIの初期化開始
            initAI();
            setupEventListeners();
        });

        // ★追加: 親タブ(GASメインアプリ)からデータが送られてきた時の処理
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'TASK_DATA') {
                const data = event.data.payload;
                populateSelect(data);
            }
        });

        function populateSelect(data) {
            taskDataList = data;
            const select = document.getElementById("taskSelect");
            select.innerHTML = '<option value="">▼ 技を選択してください</option>';
            data.forEach((task, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = task.name;
                select.appendChild(option);
            });
        }

        // ★追加: GASからデータを取得する関数
        async function fetchTaskDataFromGAS() {
            const select = document.getElementById("taskSelect");
            try {
                // URLの末尾に ?api=getTasks を付けてリクエスト
                const response = await fetch(`${GAS_WEB_APP_URL}?api=getTasks`);
                if (!response.ok) throw new Error('ネットワークエラー');
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                
                populateSelect(data);
            } catch (error) {
                console.error("データ取得失敗:", error);
                select.innerHTML = '<option value="">データの取得に失敗しました</option>';
            }
        }

        // ★修正: Google Driveのセキュリティを回避するURL生成ロジック
        function getDirectMediaUrl(url, type) {
            if (!url) return "";
            const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                const id = driveMatch[1];
                if (type === 'image') {
                    // 画像の場合: サムネイルAPIを使うとCORSエラーを回避しやすい（サイズw1200で高画質化）
                    return `https://drive.google.com/thumbnail?id=${id}&sz=w1200`;
                } else {
                    // 動画の場合: ダウンロード用エンドポイントを使用
                    return `https://drive.google.com/uc?export=download&id=${id}`;
                }
            }
            return url;
        }

        // ★修正: 読み込みエラー時の処理を追加した切り替えロジック
        function changeModelMedia() {
            const select = document.getElementById("taskSelect");
            const placeholder = document.getElementById("modelPlaceholder");
            const canvas = document.getElementById("modelCanvas");
            const ctx = canvas.getContext('2d');
            
            // リセット
            modelVideo.pause();
            modelVideo.removeAttribute('src');
            modelVideo.load();
            modelImage.removeAttribute('src');
            
            modelVideo.classList.add('hidden');
            modelImage.classList.add('hidden');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lastPoseModel = null;
            
            if (select.value === "") {
                placeholder.classList.remove('hidden');
                placeholder.innerHTML = "上のメニューから技を選んでください";
                return;
            }
            
            const task = taskDataList[select.value];
            // ★変更: typeを引数に渡す
            const directUrl = getDirectMediaUrl(task.url, task.type);
            placeholder.classList.add('hidden');
            
            if (task.type === 'image') {
                modelImage.src = directUrl;
                modelImage.classList.remove('hidden');
                
                // ★追加: 画像読み込みエラー時の処理
                modelImage.onerror = () => {
                    modelImage.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                    placeholder.innerHTML = `<span class="text-red-400">画像の読み込みに失敗しました。<br>Driveの共有設定を確認してください。</span>`;
                };

                // 画像読み込み完了時に1回だけAI解析を実行
                modelImage.onload = async () => {
                    canvas.width = modelImage.naturalWidth;
                    canvas.height = modelImage.naturalHeight;
                    if (isAiReady) {
                        try {
                            await poseModelModel.send({ image: modelImage });
                        } catch (e) {
                            console.error("AI解析エラー:", e);
                        }
                    }
                };
            } else {
                modelVideo.src = directUrl;
                modelVideo.classList.remove('hidden');
                
                // ★追加: 動画読み込みエラー時の処理
                modelVideo.onerror = () => {
                    modelVideo.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                    placeholder.innerHTML = `<span class="text-red-400">動画の読み込みに失敗しました。<br>Driveの共有設定を確認してください。</span>`;
                };

                modelVideo.onloadedmetadata = () => {
                    canvas.width = modelVideo.videoWidth;
                    canvas.height = modelVideo.videoHeight;
                };
            }
        }

        async function initAI() {
            try {
                const config = {
                    modelComplexity: 1, smoothLandmarks: true,
                    minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
                };

                document.getElementById('aiStatusText').innerText = 'AI準備中 (1/2)...';
                
                poseModelModel = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                poseModelModel.setOptions(config);
                poseModelModel.onResults((results) => {
                    lastPoseModel = results.poseLandmarks || null;
                    // ★変更: 画像の場合は常に一時停止(角度表示)扱いとする
                    const isImage = !modelImage.classList.contains('hidden');
                    const isPaused = isImage ? true : modelVideo.paused;
                    drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, isPaused);
                });
                await poseModelModel.initialize();

                document.getElementById('aiStatusText').innerText = 'AI準備中 (2/2)...';
                
                poseModelStudent = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                poseModelStudent.setOptions(config);
                poseModelStudent.onResults((results) => {
                    lastPoseStudent = results.poseLandmarks || null;
                    drawSkeleton(document.getElementById('studentCanvas'), lastPoseStudent, studentVideo.paused);
                });
                await poseModelStudent.initialize();

                isAiReady = true;
                
                const aiStatus = document.getElementById('aiStatus');
                aiStatus.innerHTML = '<span class="material-symbols-outlined text-emerald-500" style="font-size:16px;">check_circle</span> AI準備完了';
                aiStatus.classList.replace('bg-slate-100', 'bg-emerald-50');
                aiStatus.classList.replace('text-slate-500', 'text-emerald-700');
                
                const uploadLabel = document.getElementById('uploadLabel');
                uploadLabel.classList.remove('cursor-not-allowed', 'bg-slate-300', 'text-slate-500');
                uploadLabel.classList.add('cursor-pointer', 'bg-emerald-600', 'hover:bg-emerald-700', 'text-white');
                videoUpload.disabled = false;
                
                document.getElementById('studentPlaceholder').innerHTML = '<span class="material-symbols-outlined text-4xl mb-1 text-slate-300">cloud_upload</span>自分の動画を選択してください';

            } catch (error) {
                console.error("AI Initialization Error:", error);
                document.getElementById('aiStatus').innerHTML = `<span class="material-symbols-outlined text-red-500" style="font-size:16px;">error</span> エラー: ${error.message}`;
                document.getElementById('aiStatus').classList.replace('bg-slate-100', 'bg-red-50');
                document.getElementById('aiStatus').classList.replace('text-slate-500', 'text-red-700');
            }
        }

        function setupEventListeners() {
            modelVideo.addEventListener('play', () => { requestAnimationFrame(processModelLoop); });
            modelVideo.addEventListener('pause', () => { drawSkeleton(document.getElementById('modelCanvas'), lastPoseModel, true); });
            modelVideo.addEventListener('seeked', async () => { 
                if (isAiReady && modelVideo.readyState >= 2) await poseModelModel.send({ image: modelVideo }); 
            });

            studentVideo.addEventListener('play', () => { requestAnimationFrame(processStudentLoop); });
            studentVideo.addEventListener('pause', () => { drawSkeleton(document.getElementById('studentCanvas'), lastPoseStudent, true); });
            studentVideo.addEventListener('seeked', async () => { 
                if (isAiReady && studentVideo.readyState >= 2) await poseModelStudent.send({ image: studentVideo }); 
            });

            videoUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file || !isAiReady) return;
                
                studentVideo.src = URL.createObjectURL(file);
                document.getElementById('studentPlaceholder').classList.add('hidden');
                studentVideo.classList.remove('hidden');
                document.getElementById('studentCanvas').classList.remove('hidden');
                
                studentVideo.onloadedmetadata = () => {
                    document.getElementById('studentCanvas').width = studentVideo.videoWidth;
                    document.getElementById('studentCanvas').height = studentVideo.videoHeight;
                    studentVideo.play();
                };
            });
        }

        async function processModelLoop() {
            if (!modelVideo.paused && !modelVideo.ended && !isProcessingModel && modelVideo.readyState >= 2) {
                isProcessingModel = true;
                await poseModelModel.send({ image: modelVideo });
                isProcessingModel = false;
                requestAnimationFrame(processModelLoop);
            }
        }

        async function processStudentLoop() {
            if (!studentVideo.paused && !studentVideo.ended && !isProcessingStudent && studentVideo.readyState >= 2) {
                isProcessingStudent = true;
                await poseModelStudent.send({ image: studentVideo });
                isProcessingStudent = false;
                requestAnimationFrame(processStudentLoop);
            }
        }

        // --- 描画＆角度計算関数 (既存のまま変更なし) ---
        const targetJoints = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
        const customConnections = [
            [0, 11], [0, 12], [11, 12], [23, 24], [11, 23], [12, 24], 
            [11, 13], [13, 15], [12, 14], [14, 16], [23, 25], [25, 27], [24, 26], [26, 28]
        ];

        function calculateAngle(p1, p2, p3) {
            const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360.0 - angle;
            return Math.round(angle);
        }

        function drawSkeleton(canvas, poseLandmarks, isPaused) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!poseLandmarks) return;

            const width = canvas.width;
            const height = canvas.height;

            ctx.lineWidth = 8;
            ctx.strokeStyle = '#00FF00';
            customConnections.forEach(([i, j]) => {
                const p1 = poseLandmarks[i];
                const p2 = poseLandmarks[j];
                if (p1.visibility > 0.5 && p2.visibility > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x * width, p1.y * height);
                    ctx.lineTo(p2.x * width, p2.y * height);
                    ctx.stroke();
                }
            });

            targetJoints.forEach(i => {
                const p = poseLandmarks[i];
                if (p.visibility > 0.5) {
                    ctx.beginPath();
                    ctx.arc(p.x * width, p.y * height, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#FF0000';
                    ctx.stroke();
                }
            });

            if (isPaused) {
                const angleTargets = [
                    { p1: 23, p2: 11, p3: 13 }, { p1: 24, p2: 12, p3: 14 },
                    { p1: 11, p2: 13, p3: 15 }, { p1: 12, p2: 14, p3: 16 },
                    { p1: 11, p2: 23, p3: 25 }, { p1: 12, p2: 24, p3: 26 },
                    { p1: 23, p2: 25, p3: 27 }, { p1: 24, p2: 26, p3: 28 } 
                ];

                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                angleTargets.forEach(joint => {
                    const pt1 = poseLandmarks[joint.p1];
                    const pt2 = poseLandmarks[joint.p2]; 
                    const pt3 = poseLandmarks[joint.p3];

                    if (pt1.visibility > 0.5 && pt2.visibility > 0.5 && pt3.visibility > 0.5) {
                        const angle = calculateAngle(pt1, pt2, pt3);
                        const x = pt2.x * width;
                        const y = pt2.y * height - 35; 

                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 6;
                        ctx.strokeText(angle + '°', x, y);
                        ctx.fillStyle = '#FFFF00';
                        ctx.fillText(angle + '°', x, y);
                    }
                });
            }
        }
    </script>
</body>
</html>
