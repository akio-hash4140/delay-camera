<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホ・タブレットでのスクロールと拡大縮小を完全に防止 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マット運動 AI動作分析</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0',
                            700: '#334155', 800: '#1e293b', 900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Material Symbols (Google公式の洗練されたアイコン) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- MediaPipe Pose JS (Local Client Execution) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        /* 縦スクロール禁止・画面フィット設定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh; /* スマホのURLバーを考慮した動的ビューポート */
            overflow: hidden;
        }

        .video-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .video-box iframe, .video-box canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* アスペクト比を維持して全体を表示 */
        }
        
        .material-symbols-outlined {
            vertical-align: middle;
        }

        /* ローディングアニメーション用 */
        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-12 shrink-0 bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center space-x-2">
            <span class="material-symbols-outlined text-blue-600">directions_run</span>
            <h1 class="font-bold text-base text-slate-800">マット運動 AI分析</h1>
        </div>
        
        <div id="aiStatus" class="flex items-center gap-1.5 text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">
            <div class="loader"></div>
            AI準備中...
        </div>
    </header>

    <!-- Main Content Layout -->
    <!-- PC/タブレット横向きは左右2分割、スマホ縦向きは上下2分割に自動可変し、スクロールを防止 -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 grid-rows-2 md:grid-rows-1 gap-3 p-3 min-h-0">

        <!-- PANEL 1: 模範動画 -->
        <section class="bg-white rounded-lg p-2 md:p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm">
            <div class="flex items-center gap-2 mb-2 shrink-0">
                <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap flex items-center gap-1">
                    <span class="material-symbols-outlined" style="font-size: 14px;">menu_book</span> 見本
                </span>
                <select id="taskSelect" onchange="changeModelVideo()" class="flex-1 bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500">
                    <option value="">データを読み込み中...</option>
                </select>
            </div>

            <!-- Model Video Container -->
            <div class="flex-1 video-box bg-slate-900">
                <iframe id="modelVideo" src="" class="w-full h-full border-none" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                <div id="modelPlaceholder" class="absolute inset-0 flex items-center justify-center text-slate-400 text-sm font-bold pointer-events-none">
                    上のメニューから技を選んでください
                </div>
            </div>
        </section>

        <!-- PANEL 2: 自分の動画とモーションキャプチャ -->
        <section class="bg-white rounded-lg p-2 md:p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm relative">
            <div class="flex items-center justify-between gap-2 mb-2 shrink-0">
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap flex items-center gap-1">
                        <span class="material-symbols-outlined" style="font-size: 14px;">person_play</span> 自分の動き
                    </span>
                    
                    <label id="uploadLabel" class="cursor-not-allowed bg-slate-300 text-slate-500 text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors">
                        <span class="material-symbols-outlined" style="font-size: 16px;">upload_file</span> 動画を選ぶ
                        <input type="file" id="videoUpload" accept="video/*" class="hidden" disabled>
                    </label>
                </div>
                <div class="hidden sm:block text-xs text-slate-500 font-bold">
                    ※動画にAI骨格が重なります
                </div>
            </div>

            <!-- Student Video & Motion Capture Canvas Container -->
            <div class="flex-1 video-box bg-black cursor-pointer group" id="studentBox" onclick="togglePlayPause()" title="クリックで再生/一時停止">
                <!-- 映像出力用の非表示Videoタグ -->
                <video id="studentVideo" loop muted playsinline class="hidden"></video>
                <!-- AI描画と映像を合成するCanvas -->
                <canvas id="studentCanvas" class="hidden w-full h-full object-contain"></canvas>
                
                <div id="studentPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm font-bold pointer-events-none gap-2">
                    <span class="material-symbols-outlined text-4xl mb-1 text-slate-300">cloud_upload</span>
                    AIの準備完了後に動画を選んでください
                </div>

                <!-- 再生/一時停止アイコンのフィードバック -->
                <div id="playPauseIcon" class="absolute inset-0 flex items-center justify-center text-white opacity-0 pointer-events-none transition-opacity duration-300">
                    <span class="material-symbols-outlined drop-shadow-lg" style="font-size: 4rem;">play_arrow</span>
                </div>
            </div>
        </section>

    </main>

    <script>
        // === スプレッドシート連携処理 ===
        let taskDataList = [];

        window.addEventListener('DOMContentLoaded', () => {
            initMediaPipe(); // AI初期化開始
            
            // GAS環境（Apps Script）で動作しているか、GitHub等の外部サーバーかを自動判定
            if (typeof google !== 'undefined' && google.script) {
                // GAS環境：スプレッドシートから直接取得
                google.script.run.withSuccessHandler(populateSelect).getTaskDataForAnalysis();
            } else {
                // GitHub Pages等環境：動作確認用のサンプルデータを表示
                // ※将来的にGitHubからスプレッドシートのデータを読みたい場合は、GASを「Webアプリ」として公開し fetch() で取得する仕組みに変更します。
                populateSelect([
                    { name: "開脚前転（サンプル）", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                    { name: "後転（サンプル）", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                    { name: "倒立前転（サンプル）", url: "https://www.youtube.com/embed/39udgGPyYMg" }
                ]);
            }
        });

        function populateSelect(data) {
            taskDataList = data;
            const select = document.getElementById("taskSelect");
            select.innerHTML = '<option value="">▼ 技を選択してください</option>';
            
            data.forEach((task, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = task.name;
                select.appendChild(option);
            });
        }

        function changeModelVideo() {
            const select = document.getElementById("taskSelect");
            const iframe = document.getElementById("modelVideo");
            const placeholder = document.getElementById("modelPlaceholder");
            
            if (select.value === "") {
                iframe.src = "";
                placeholder.classList.remove('hidden');
                return;
            }
            
            let url = taskDataList[select.value].url;
            // Googleドライブの共有リンクを埋め込み用(preview)に変換
            if (url.includes("view?usp=sharing") || url.includes("view?usp=drivesdk")) {
                url = url.replace(/\/view.*/, "/preview");
            }
            
            iframe.src = url;
            placeholder.classList.add('hidden');
        }

        // === AI (MediaPipe Pose) 処理 ===
        let poseModel;
        let isAiReady = false;
        let isProcessingFrame = false;
        
        const videoUpload = document.getElementById('videoUpload');
        const uploadLabel = document.getElementById('uploadLabel');
        const studentVideo = document.getElementById('studentVideo');
        const studentCanvas = document.getElementById('studentCanvas');
        const ctx = studentCanvas.getContext('2d');
        const studentPlaceholder = document.getElementById('studentPlaceholder');

        async function initMediaPipe() {
            try {
                poseModel = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });
                
                poseModel.setOptions({
                    modelComplexity: 1, // 0:軽量, 1:標準, 2:高精度
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                poseModel.onResults(onPoseResults);
                
                // AIモデルを事前にウォームアップ（初期化）
                await poseModel.initialize();
                
                isAiReady = true;
                
                // UIを有効化
                const aiStatus = document.getElementById('aiStatus');
                aiStatus.innerHTML = '<span class="material-symbols-outlined text-emerald-500" style="font-size:16px;">check_circle</span> AI準備完了';
                aiStatus.classList.remove('bg-slate-100', 'text-slate-500');
                aiStatus.classList.add('bg-emerald-50', 'text-emerald-700');
                
                uploadLabel.classList.remove('cursor-not-allowed', 'bg-slate-300', 'text-slate-500');
                uploadLabel.classList.add('cursor-pointer', 'bg-emerald-600', 'hover:bg-emerald-700', 'text-white');
                videoUpload.disabled = false;
                
                studentPlaceholder.innerHTML = '<span class="material-symbols-outlined text-4xl mb-1 text-slate-300">cloud_upload</span>自分の動画を選択してください';

            } catch (error) {
                console.error("AI Initialization Error:", error);
                document.getElementById('aiStatus').innerHTML = '<span class="material-symbols-outlined text-red-500" style="font-size:16px;">error</span> AI読込エラー';
            }
        }

        // 動画ファイルが選ばれたときの処理
        videoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !isAiReady) return;
            
            const url = URL.createObjectURL(file);
            studentVideo.src = url;
            
            studentPlaceholder.classList.add('hidden');
            studentCanvas.classList.remove('hidden');
            
            // 動画のメタデータが読み込まれたらキャンバスサイズを合わせる
            studentVideo.onloadedmetadata = () => {
                studentCanvas.width = studentVideo.videoWidth;
                studentCanvas.height = studentVideo.videoHeight;
                studentVideo.play();
                requestAnimationFrame(processVideoLoop);
            };
        });

        // 動画のフレームごとにAI解析へ投げるループ
        async function processVideoLoop() {
            if (!studentVideo.paused && !studentVideo.ended && !isProcessingFrame) {
                isProcessingFrame = true;
                // 現在の映像フレームをMediaPipeへ送信
                await poseModel.send({ image: studentVideo });
                isProcessingFrame = false;
            }
            requestAnimationFrame(processVideoLoop);
        }

        // AIの解析結果が返ってきたときの描画処理 (動画フレーム + 骨格)
        function onPoseResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, studentCanvas.width, studentCanvas.height);
            
            // 1. 元の動画フレームを描画
            ctx.drawImage(results.image, 0, 0, studentCanvas.width, studentCanvas.height);
            
            // 2. 骨格が検出されていればオーバーレイ描画
            if (results.poseLandmarks) {
                drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, 
                             { color: '#00FF00', lineWidth: 4 }); // 緑色の線
                drawLandmarks(ctx, results.poseLandmarks, 
                            { color: '#FF0000', fillColor: '#FFFFFF', lineWidth: 2, radius: 4 }); // 赤枠・白塗りの点
            }
            ctx.restore();
        }

        // 画面クリックで再生・一時停止を切り替える
        function togglePlayPause() {
            if (!studentVideo.src) return;
            
            const icon = document.getElementById('playPauseIcon');
            
            if (studentVideo.paused) {
                studentVideo.play();
                icon.innerHTML = '<span class="material-symbols-outlined drop-shadow-lg" style="font-size: 4rem;">play_arrow</span>';
            } else {
                studentVideo.pause();
                icon.innerHTML = '<span class="material-symbols-outlined drop-shadow-lg" style="font-size: 4rem;">pause</span>';
            }
            
            // アイコンをフワッと表示して消す
            icon.classList.remove('opacity-0');
            setTimeout(() => {
                icon.classList.add('opacity-0');
            }, 600);
        }
    </script>
</body>
</html>
