<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マット運動 モーションキャプチャ分析</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0',
                            700: '#334155', 800: '#1e293b', 900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- MediaPipe Pose JS (Local Client Execution) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        .video-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .video-box iframe, .video-box canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* ローディングアニメーション用 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6; /* blue-500 */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-person-running text-blue-600 text-xl"></i>
            <h1 class="font-bold text-base text-slate-800">マット運動 AI分析</h1>
        </div>
        
        <div id="aiStatus" class="flex items-center gap-1.5 text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">
            <div class="loader" style="width: 14px; height: 14px; border-width: 2px;"></div>
            AI準備中...
        </div>
    </header>

    <!-- Main Content Layout (2 Rows) -->
    <main class="flex-1 grid grid-rows-2 gap-3 p-3 h-[calc(100vh-55px)]">

        <!-- UPPER PANEL: 模範動画 (スプレッドシート連動) -->
        <section class="bg-white rounded-lg p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm">
            <div class="flex items-center gap-3 mb-2">
                <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap">👀 見本</span>
                <!-- スプレッドシートから読み込んだ技がここに入ります -->
                <select id="taskSelect" onchange="changeModelVideo()" class="flex-1 bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500">
                    <option value="">データを読み込み中...</option>
                </select>
            </div>

            <!-- Model Video Container -->
            <div class="flex-1 video-box bg-slate-900">
                <!-- Googleドライブの動画を表示するためのiframe -->
                <iframe id="modelVideo" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                <div id="modelPlaceholder" class="absolute inset-0 flex items-center justify-center text-slate-400 text-sm font-bold pointer-events-none">
                    上のメニューから技を選んでください
                </div>
            </div>
        </section>

        <!-- LOWER PANEL: 自分の動画とモーションキャプチャ -->
        <section class="bg-white rounded-lg p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm relative">
            <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-3">
                    <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap">📸 自分の動き</span>
                    
                    <label id="uploadLabel" class="cursor-not-allowed bg-slate-300 text-slate-500 text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors">
                        <i class="fa-solid fa-video"></i> 動画を選ぶ
                        <input type="file" id="videoUpload" accept="video/*" class="hidden" disabled>
                    </label>
                </div>
                <div class="text-xs text-slate-500 font-bold">
                    ※動画を入れると自動で骨格が出ます
                </div>
            </div>

            <!-- Student Video & Motion Capture Canvas Container -->
            <div class="flex-1 video-box bg-black cursor-pointer" id="studentBox" onclick="togglePlayPause()" title="クリックで再生/一時停止">
                <!-- 実際の動画要素は非表示にし、Canvasに映像と骨格を両方描画します -->
                <video id="studentVideo" loop muted playsinline class="hidden"></video>
                <canvas id="studentCanvas" class="hidden w-full h-full object-contain"></canvas>
                
                <div id="studentPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm font-bold pointer-events-none gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl mb-1 text-slate-300"></i>
                    AIの準備が完了したら動画を選んでください
                </div>

                <!-- 再生/一時停止アイコンのフィードバック -->
                <div id="playPauseIcon" class="absolute inset-0 flex items-center justify-center text-white text-6xl opacity-0 pointer-events-none transition-opacity duration-300">
                    <i class="fa-solid fa-play drop-shadow-lg"></i>
                </div>
            </div>
        </section>

    </main>

    <script>
        // === スプレッドシート連携処理 (GAS環境用) ===
        let taskDataList = [];

        window.addEventListener('DOMContentLoaded', () => {
            initMediaPipe(); // AI初期化開始
            
            // GAS環境で動いている場合は google.script.run を呼び出す
            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler(populateSelect).getTaskDataForAnalysis();
            } else {
                // ローカルやプレビュー環境用のダミーデータ（動作確認用）
                populateSelect([
                    { name: "開脚前転（サンプル）", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                    { name: "後転（サンプル）", url: "https://www.youtube.com/embed/tgbNymZ7vqY" }
                ]);
            }
        });

        function populateSelect(data) {
            taskDataList = data;
            const select = document.getElementById("taskSelect");
            select.innerHTML = '<option value="">▼ 技を選択してください</option>';
            
            data.forEach((task, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = task.name;
                select.appendChild(option);
            });
        }

        function changeModelVideo() {
            const select = document.getElementById("taskSelect");
            const iframe = document.getElementById("modelVideo");
            const placeholder = document.getElementById("modelPlaceholder");
            
            if (select.value === "") {
                iframe.src = "";
                placeholder.classList.remove('hidden');
                return;
            }
            
            let url = taskDataList[select.value].url;
            // Googleドライブのリンクを埋め込み用プレビューURLに変換
            if (url.includes("view?usp=sharing") || url.includes("view?usp=drivesdk")) {
                url = url.replace(/\/view.*/, "/preview");
            }
            
            iframe.src = url;
            placeholder.classList.add('hidden');
        }

        // === AI (MediaPipe Pose) 処理 ===
        let poseModel;
        let isAiReady = false;
        let isProcessingFrame = false;
        
        const videoUpload = document.getElementById('videoUpload');
        const uploadLabel = document.getElementById('uploadLabel');
        const studentVideo = document.getElementById('studentVideo');
        const studentCanvas = document.getElementById('studentCanvas');
        const ctx = studentCanvas.getContext('2d');
        const studentPlaceholder = document.getElementById('studentPlaceholder');

        async function initMediaPipe() {
            try {
                poseModel = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });
                
                poseModel.setOptions({
                    modelComplexity: 1, // 0:軽量, 1:標準, 2:高精度
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                poseModel.onResults(onPoseResults);
                
                // AIモデルを事前にウォームアップ（初期化）
                await poseModel.initialize();
                
                isAiReady = true;
                
                // UIを有効化
                const aiStatus = document.getElementById('aiStatus');
                aiStatus.innerHTML = '<i class="fa-solid fa-check text-emerald-500"></i> AI準備完了';
                aiStatus.classList.remove('bg-slate-100', 'text-slate-500');
                aiStatus.classList.add('bg-emerald-50', 'text-emerald-700');
                
                uploadLabel.classList.remove('cursor-not-allowed', 'bg-slate-300', 'text-slate-500');
                uploadLabel.classList.add('cursor-pointer', 'bg-emerald-600', 'hover:bg-emerald-700', 'text-white');
                videoUpload.disabled = false;
                
                studentPlaceholder.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-3xl mb-1 text-slate-300"></i>自分の動画をアップロードしてください';

            } catch (error) {
                console.error("AI Initialization Error:", error);
                document.getElementById('aiStatus').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i> AI読込エラー';
            }
        }

        // 動画ファイルが選ばれたときの処理
        videoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !isAiReady) return;
            
            const url = URL.createObjectURL(file);
            studentVideo.src = url;
            
            studentPlaceholder.classList.add('hidden');
            studentCanvas.classList.remove('hidden');
            
            // 動画の準備ができたら再生＆解析ループ開始
            studentVideo.onloadedmetadata = () => {
                studentCanvas.width = studentVideo.videoWidth;
                studentCanvas.height = studentVideo.videoHeight;
                studentVideo.play();
                requestAnimationFrame(processVideoLoop);
            };
        });

        // 動画のフレームごとにAI解析へ投げるループ
        async function processVideoLoop() {
            if (!studentVideo.paused && !studentVideo.ended && !isProcessingFrame) {
                isProcessingFrame = true;
                // MediaPipeへ現在の動画フレームを送信（解析完了すると onPoseResults が呼ばれる）
                await poseModel.send({ image: studentVideo });
                isProcessingFrame = false;
            }
            // 停止中でも映像を描画し続けるためループは止めない
            requestAnimationFrame(processVideoLoop);
        }

        // AIの解析結果が返ってきたときの描画処理
        function onPoseResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, studentCanvas.width, studentCanvas.height);
            
            // 1. 元の動画フレームを描画
            ctx.drawImage(results.image, 0, 0, studentCanvas.width, studentCanvas.height);
            
            // 2. 骨格が検出されていればオーバーレイ描画
            if (results.poseLandmarks) {
                // 関節同士を結ぶ線（ワイヤー）
                drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, 
                             { color: '#00FF00', lineWidth: 4 }); // 鮮やかな緑色
                // 関節の点
                drawLandmarks(ctx, results.poseLandmarks, 
                            { color: '#FF0000', fillColor: '#FFFFFF', lineWidth: 2, radius: 4 }); // 赤枠・白塗りの点
            }
            ctx.restore();
        }

        // 画面クリックで再生・一時停止を切り替える
        function togglePlayPause() {
            if (!studentVideo.src) return;
            
            const icon = document.getElementById('playPauseIcon');
            
            if (studentVideo.paused) {
                studentVideo.play();
                icon.innerHTML = '<i class="fa-solid fa-play drop-shadow-lg"></i>';
            } else {
                studentVideo.pause();
                icon.innerHTML = '<i class="fa-solid fa-pause drop-shadow-lg"></i>';
            }
            
            // アイコンをフワッと表示して消すアニメーション
            icon.classList.remove('opacity-0');
            setTimeout(() => {
                icon.classList.add('opacity-0');
            }, 600);
        }
    </script>
</body>
</html>
