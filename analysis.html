<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マット運動 ストロボ分析ツール</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0',
                            700: '#334155', 800: '#1e293b', 900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .video-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .video-box iframe, .video-box video, .video-box canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* ローディングアニメーション用 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-person-running text-blue-600 text-xl"></i>
            <h1 class="font-bold text-base text-slate-800">マット運動 ストロボ分析</h1>
        </div>

        <!-- Screenshot Button -->
        <button onclick="captureStrobeScreen()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded flex items-center gap-1.5 shadow-sm active:scale-95 transition-transform">
            <i class="fa-solid fa-camera"></i> 画像として保存
        </button>
    </header>

    <!-- Main Content Layout (2 Rows) -->
    <main class="flex-1 grid grid-rows-2 gap-3 p-3 h-[calc(100vh-55px)]">

        <!-- UPPER PANEL: 模範動画 (スプレッドシート連動) -->
        <section class="bg-white rounded-lg p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm">
            <div class="flex items-center gap-3 mb-2">
                <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap">👀 見本</span>
                <!-- スプレッドシートから読み込んだ技がここに入ります -->
                <select id="taskSelect" onchange="changeModelVideo()" class="flex-1 bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500">
                    <option value="">データを読み込み中...</option>
                </select>
            </div>

            <!-- Model Video Container -->
            <div class="flex-1 video-box bg-slate-900">
                <!-- Googleドライブの動画を表示するためのiframe -->
                <iframe id="modelVideo" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                <div id="modelPlaceholder" class="absolute inset-0 flex items-center justify-center text-slate-400 text-sm font-bold pointer-events-none">
                    上のメニューから技を選んでください
                </div>
            </div>
        </section>

        <!-- LOWER PANEL: 自分の動画とストロボ生成 -->
        <section class="bg-white rounded-lg p-3 border border-slate-200 flex flex-col min-h-0 shadow-sm relative">
            <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-3">
                    <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded text-xs whitespace-nowrap">📸 自分の動き</span>
                    
                    <label class="cursor-pointer bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors">
                        <i class="fa-solid fa-video"></i> 動画を選ぶ
                        <input type="file" id="videoUpload" accept="video/*" class="hidden">
                    </label>
                </div>

                <!-- 連続写真生成ボタン -->
                <button id="generateBtn" disabled onclick="generateStrobe()" class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-xs font-bold px-4 py-1.5 rounded flex items-center gap-1.5 shadow-sm transition-colors">
                    <i class="fa-solid fa-layer-group"></i> 連続写真をつくる
                </button>
            </div>

            <!-- Student Video & Strobe Canvas Container -->
            <div class="flex-1 video-box bg-black" id="studentBox">
                <video id="studentVideo" playsinline controls class="hidden"></video>
                <canvas id="strobeCanvas" class="hidden"></canvas>
                
                <div id="studentPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm font-bold pointer-events-none gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl mb-1 text-slate-300"></i>
                    自分の動画をアップロードしてください
                </div>

                <!-- ローディング表示 -->
                <div id="loadingOverlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center text-white hidden z-10">
                    <div class="loader mb-2"></div>
                    <span class="text-sm font-bold">画像を合成中...</span>
                </div>
            </div>
        </section>

    </main>

    <!-- Simple Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white text-sm px-4 py-3 rounded shadow-lg transition-all transform translate-y-20 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="toastMsg">メッセージ</span>
    </div>

    <script>
        // === スプレッドシート連携処理 (GAS環境用) ===
        let taskDataList = [];

        window.addEventListener('DOMContentLoaded', () => {
            // GAS環境で動いている場合は google.script.run を呼び出す
            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler(populateSelect).getTaskDataForAnalysis();
            } else {
                // ローカルやプレビュー環境用のダミーデータ（動作確認用）
                populateSelect([
                    { name: "開脚前転（サンプル）", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                    { name: "後転（サンプル）", url: "https://www.youtube.com/embed/tgbNymZ7vqY" }
                ]);
            }
        });

        function populateSelect(data) {
            taskDataList = data;
            const select = document.getElementById("taskSelect");
            select.innerHTML = '<option value="">▼ 技を選択してください</option>';
            
            data.forEach((task, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = task.name;
                select.appendChild(option);
            });
        }

        function changeModelVideo() {
            const select = document.getElementById("taskSelect");
            const iframe = document.getElementById("modelVideo");
            const placeholder = document.getElementById("modelPlaceholder");
            
            if (select.value === "") {
                iframe.src = "";
                placeholder.classList.remove('hidden');
                return;
            }
            
            let url = taskDataList[select.value].url;
            
            // Googleドライブのリンクを埋め込み用プレビューURLに変換
            if (url.includes("view?usp=sharing") || url.includes("view?usp=drivesdk")) {
                url = url.replace(/\/view.*/, "/preview");
            }
            
            iframe.src = url;
            placeholder.classList.add('hidden');
        }

        // === 生徒動画 ＆ ストロボ生成処理 ===
        const videoUpload = document.getElementById('videoUpload');
        const studentVideo = document.getElementById('studentVideo');
        const strobeCanvas = document.getElementById('strobeCanvas');
        const ctx = strobeCanvas.getContext('2d');
        const generateBtn = document.getElementById('generateBtn');
        const studentPlaceholder = document.getElementById('studentPlaceholder');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // 動画ファイルの読み込み
        videoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const url = URL.createObjectURL(file);
            studentVideo.src = url;
            
            studentPlaceholder.classList.add('hidden');
            strobeCanvas.classList.add('hidden');
            studentVideo.classList.remove('hidden');
            
            // メタデータが読み込まれたらボタンを有効化
            studentVideo.onloadedmetadata = () => {
                generateBtn.disabled = false;
                strobeCanvas.width = studentVideo.videoWidth;
                strobeCanvas.height = studentVideo.videoHeight;
            };
        });

        // ストロボ（連続写真）の生成
        async function generateStrobe() {
            if (studentVideo.duration <= 0) return;
            
            // UIの切り替え
            generateBtn.disabled = true;
            loadingOverlay.classList.remove('hidden');
            studentVideo.classList.add('hidden');
            strobeCanvas.classList.remove('hidden');
            
            // キャンバスを黒でクリア
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, strobeCanvas.width, strobeCanvas.height);
            
            const numFrames = 6; // 抽出するコマ数
            const interval = studentVideo.duration / numFrames;
            
            studentVideo.pause();
            
            for (let i = 0; i < numFrames; i++) {
                studentVideo.currentTime = interval * i;
                
                // 動画のシーク（指定時間への移動）が完了するのを待つ
                await new Promise(resolve => {
                    studentVideo.addEventListener('seeked', function onSeeked() {
                        studentVideo.removeEventListener('seeked', onSeeked);
                        // 描画の安定化のため少しだけ待機
                        setTimeout(resolve, 50);
                    });
                });
                
                // 前のコマと綺麗に重ねるための透過設定
                ctx.globalAlpha = i === 0 ? 1.0 : 0.6; 
                ctx.globalCompositeOperation = i === 0 ? 'source-over' : 'screen';
                
                ctx.drawImage(studentVideo, 0, 0, strobeCanvas.width, strobeCanvas.height);
            }
            
            // 通常の描画モードに戻す
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';
            
            // 処理完了
            loadingOverlay.classList.add('hidden');
            generateBtn.disabled = false;
            showToast("連続写真を生成しました！");
        }

        // === 画面保存（スクショ）処理 ===
        function captureStrobeScreen() {
            // キャンバスが表示されていなければエラー
            if (strobeCanvas.classList.contains('hidden')) {
                showToast("先に「連続写真」を作成してください");
                return;
            }

            const imageURL = strobeCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
            link.download = `mat_strobe_${dateStr}.png`;
            link.href = imageURL;
            link.click();
            
            showToast("📸 画像をダウンロードしました");
        }

        // === トースト通知 ===
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
