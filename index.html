<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>遅延再生カメラ</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    body {
      margin: 0; background: #0f172a; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
    }
    #videoContainer {
      position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      width: 100%; height: 100%; object-fit: contain;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; padding: 15px; width: 100%; box-sizing: border-box; background: #1e293b;
    }
    .delay-btn {
      padding: 10px 16px; font-size: 1rem; font-weight: bold; color: #fff; background: rgba(255,255,255,0.1); border: 2px solid #475569; border-radius: 8px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px;
    }
    .delay-btn.active {
      background: #2563eb; border-color: #3b82f6;
    }
    .header {
      width: 100%; padding: 12px; background: #1e293b; text-align: center; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 10;
    }
    .custom-input-group {
      display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 8px;
    }
    .custom-input {
      width: 50px; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 1rem; font-weight: bold; outline: none;
    }

    /* 全画面表示用のスタイル */
    body.is-fullscreen .header,
    body.is-fullscreen .controls {
      display: none !important;
    }
    body.is-fullscreen #videoContainer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; max-width: none; z-index: 9999; background: #000;
    }
    #exitFsBtn {
      display: none; position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); color: white; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 10000; align-items: center; gap: 6px;
    }
    body.is-fullscreen #exitFsBtn {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- Safariフリーズ対策: 見えない生カメラを裏に配置して強制駆動させる -->
  <video id="hiddenVideo" autoplay playsinline muted style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></video>

  <div class="header">
    <span class="material-symbols-outlined" style="color: #38bdf8;">videocam</span> 遅延再生カメラ
  </div>

  <div id="videoContainer">
    <canvas id="delayCanvas"></canvas>
    <!-- 全画面解除ボタン -->
    <button id="exitFsBtn" onclick="toggleFullscreen()">
      <span class="material-symbols-outlined">close_fullscreen</span> 戻る
    </button>
  </div>

  <div class="controls">
    <button class="delay-btn active" onclick="setDelay(5, this)">5秒</button>
    <button class="delay-btn" onclick="setDelay(7, this)">7秒</button>
    <button class="delay-btn" onclick="setDelay(10, this)">10秒</button>
    
    <!-- フリー入力欄 -->
    <div class="custom-input-group">
      <input type="number" id="customSec" class="custom-input" min="1" max="60" value="15">
      <span style="font-weight:bold; font-size:0.9rem; color:#cbd5e1;">秒</span>
      <button class="delay-btn" onclick="setCustomDelay(this)">適用</button>
    </div>

    <!-- 全画面ボタン -->
    <button class="delay-btn" onclick="toggleFullscreen()" style="background:#059669; border-color:#10b981; margin-left:10px;">
      <span class="material-symbols-outlined" style="font-size:1.1rem;">fullscreen</span> 全画面
    </button>
  </div>

  <script>
    const video = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('delayCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const offscreenCanvas = document.createElement('canvas');
    const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

    let frameBuffer = [];
    let delaySeconds = 5;
    let fps = 24; 
    let loopId = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        
        video.srcObject = stream;
        
        // Safari対策: 明示的に再生を指示
        video.play().catch(e => console.error("Play error:", e));
        
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          offscreenCanvas.width = video.videoWidth;
          offscreenCanvas.height = video.videoHeight;
          
          if (loopId) clearInterval(loopId);
          loopId = setInterval(processFrame, 1000 / fps);
        };
      } catch (err) {
        alert("カメラの起動に失敗しました。端末のカメラアクセス許可を確認してください。");
      }
    }

    function processFrame() {
      // Safari対策: 準備が完全に整う前（HAVE_ENOUGH_DATA）でも映像が取れる状態なら進める
      if(video.readyState < 2) return; 
      
      offCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
      const frameData = offCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
      frameBuffer.push(frameData);
      
      const targetFrames = delaySeconds * fps;
      
      if (frameBuffer.length >= targetFrames) {
        const oldFrame = frameBuffer.shift();
        ctx.putImageData(oldFrame, 0, 0);
      } else {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 32px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const remaining = Math.ceil((targetFrames - frameBuffer.length) / fps);
        ctx.fillText(`準備中... あと ${remaining} 秒`, canvas.width / 2, canvas.height / 2);
      }
      
      while (frameBuffer.length > targetFrames) {
        frameBuffer.shift();
      }
    }

    function setDelay(sec, btnElement) {
      delaySeconds = sec;
      document.querySelectorAll('.delay-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    function setCustomDelay(btnElement) {
      const sec = parseInt(document.getElementById('customSec').value, 10);
      if(isNaN(sec) || sec < 1) {
        alert("1秒以上の数字を入力してください");
        return;
      }
      if(sec > 60) {
        alert("iPadの動作を安定させるため、最大60秒までにしてください");
        return;
      }
      setDelay(sec, btnElement);
    }

    function toggleFullscreen() {
      document.body.classList.toggle('is-fullscreen');
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
